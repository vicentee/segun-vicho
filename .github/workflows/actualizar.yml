name: Actualizar reporte

on:
  schedule:
    # 00:15, 06:15, 12:15 y 18:15 en Chile con horario de verano (UTC-3).
    # En invierno (UTC-4) corre una hora antes; la tarea programada principal sí sigue la hora de Chile.
    - cron: "15 3,9,15,21 * * *"
  push:
    branches: [main]
    paths: ["web.json", "template.html", "build.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reporte
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir index.html con la mediana de todas las fuentes
        run: python3 -I build.py template.html web.json index.html
      - name: Publicar si cambió
        run: |
          git config user.name "segun-vicho-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Reporte actualizado $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
