  const S=DATA.spots[key],P=SPOTS[key];
  const sh=S.sh[i]||0,sp=S.sp[i]||0,sec=secValid(S,i),h2=sec?S.h2[i]:0,p2=sec?S.p2[i]:0;
  const e1=sh*sh,e2=h2*h2,heff=Math.sqrt(e1+e2),teff=(e1*sp+e2*p2)/Math.max(e1+e2,1e-6);
  const face=heff*P.k*clamp(.75+.035*(teff-10),.75,1.3);
  const sw=P.lo+.6*(P.hi-P.lo);const size=face<P.min?.05:face<P.lo?.25+.45*(face-P.min)/(P.lo-P.min):face<sw?.7+.3*(face-P.lo)/(sw-P.lo):face<=P.hi?1:face<=P.max?1-.5*(face-P.hi)/(P.max-P.hi):.3;
  const per=clamp((teff-9)/9,.2,1),dq=swellDirQ(S.sd[i]);
  const ws=S.ws[i]??0,wd=S.wd[i]??0,q=windQ(wd,key);
  let wf=ws<=6?1:1-(1-q)*Math.min(1,(ws-6)/14); if(ws>20) wf*=Math.max(.5,1-(ws-20)/40);
  const chop=clamp(1-(S.ww[i]||0)*.35,.6,1), tf=1-.15*Math.min(1,Math.abs((S.tide[i]??0)-P.tidePref)/.5);
  const score=clamp(10*size*(.45+.55*per)*dq*wf*chop*tf*.97,0,10);
  const lo=S.shLo?.[i]??sh, hi=S.shHi?.[i]??sh;
  return {key,i,score,face,heff,teff,sh,sp,sd:S.sd[i],h2,p2,d2:S.d2[i],sec,ws,wd,wg:S.wg[i],tide:S.tide[i],kw:.49*.9*(e1*sp+e2*p2),
    ta:S.ta[i],cc:S.cc[i],pr:S.pr[i],sst:S.sst[i],lo,hi,wsLo:S.wsLo?.[i]??ws,wsHi:S.wsHi?.[i]??ws,nW:S.nW?.[i]||1,nV:S.nV?.[i]||1};
}
function daylight(key,d){const s=DATA.spots[key].sun[dKey(d)];return s?[toH(s[0]),toH(s[1])]:[7,20]}
function analyse(key,d,from=0){
  const [sr,ss]=daylight(key,d),hrs=[];
  for(let h=Math.max(Math.ceil(sr-.25),Math.ceil(from));h<=Math.floor(ss-.75);h++) hrs.push(hourly(key,d*24+h));
  if(!hrs.length) return null;
  let best=null;
  for(let j=0;j<hrs.length;j++){const a=hrs[j],b=hrs[j+1]||a,v=(a.score+b.score)/2;if(!best||v>best.v) best={v,start:a.i%24,end:(b.i%24)+1,a,b}}
  const peak=hrs.reduce((m,x)=>x.score>m.score?x:m,hrs[0]);
  return {key,d,hrs,best,peak,score:best.v};
}
const lvl=s=>s<2.5?0:s<4.5?1:s<6.5?2:s<8.3?3:4;
const lvlWord=s=>["no pasa","igual sale","bueno","épico","épico"][lvl(s)];
const TREND=d=>d>=curDay+7;  // días 8 a 10: pocas fuentes, solo tendencia
function confidence(x){const rel=(x.hi-x.lo)/Math.max(x.sh,.3),wsr=x.wsHi-x.wsLo;
  if(x.nW<3||x.nV<3) return ["baja","quedan pocas fuentes a esta distancia"];
  return rel<.28&&wsr<9?["alta","las fuentes coinciden"]:rel<.5&&wsr<15?["media","las fuentes difieren algo"]:["baja","las fuentes no se ponen de acuerdo"]}
function board(x,key){ // [tabla, por qué] según tamaño en la rompiente, potencia y qué tan limpio está
  const f=x.face,clean=windQ(x.wd,key)>=.85||x.ws<6,soft=x.kw<14;
  if(f<.6) return ["el longboard","ola chica, necesitas remada y deslizamiento"];
  if(f<.9){
    if(key==="pue"&&clean) return ["el longboard","paredes largas y suaves para planear"];
    return clean?["una tabla gruesa","poca fuerza, el volumen te mete en la ola"]:["una tabla de espuma media","chico y desordenado, es estable y perdona"];
  }
  if(f<1.3&&(soft||!clean)) return ["una tabla gruesa",soft?"ola sin fuerza, más volumen para entrar temprano":"con viento, más estabilidad en el chop"];
  return ["un shortboard","tamaño y fuerza para maniobrar en la pared"];
}
function tidesOn(key,d){return DATA.spots[key].tides.map(t=>({day:Math.floor(t.m/1440),h:(t.m%1440)/60,ht:t.h,type:t.type})).filter(t=>t.day===d)}

/* ——— tiempo y análisis ——— */
const nowIdx=(Date.now()-T0)/36e5, curDay=clamp(Math.floor(nowIdx/24),0,ND-1);
const ANA=[];for(let d=0;d<ND;d++){ANA[d]={};KEYS.forEach(k=>ANA[d][k]=analyse(k,d))}
const bestOf=(d,from)=>{let b=null;KEYS.forEach(k=>{const a=from!=null?analyse(k,d,from):ANA[d][k];if(a&&(!b||a.score>b.score))b=a});return b};
const G=new Date(Date.parse(DATA.generated_utc)+OFF*1000).toISOString().slice(0,16);
/* reloj en vivo y antigüedad de los datos, en hora de Chile */
const fmtCL=new Intl.DateTimeFormat("es-CL",{timeZone:"America/Santiago",hour:"2-digit",minute:"2-digit",hour12:false});
const dayCL=new Intl.DateTimeFormat("es-CL",{timeZone:"America/Santiago",day:"numeric",month:"numeric"});
function ago(ms){const m=Math.round(ms/6e4);return m<1?"recién":m<60?`hace ${m} min`:m<1440?`hace ${Math.floor(m/60)} h${m%60?" "+(m%60)+" min":""}`:`hace ${Math.floor(m/1440)} d`}
function tick(){const now=new Date(),gen=new Date(DATA.generated_utc),same=dayCL.format(now)===dayCL.format(gen);
  document.getElementById("meta").innerHTML=`<span class="clock"><i></i>${fmtCL.format(now)}</span><span class="upd">datos ${fmtCL.format(gen)}${same?"":" del "+dayCL.format(gen)} · ${ago(now-gen)}</span>`}
tick();setInterval(()=>{tick();refreshNow()},30000);
if(Date.now()-Date.parse(DATA.generated_utc)>12*36e5||nowIdx>NH-30){const s=document.getElementById("stale");s.hidden=false;s.textContent=`Datos del ${G.slice(8,10)}/${G.slice(5,7)} ${G.slice(11)}: tienen más de 12 horas. Se actualiza a las 00:00, 06:00, 12:00 y 18:00.`}

/* ——— vocabulario de playa ——— */
const sizeWord=f=>f<.5?["chico","a la rodilla"]:f<.8?["medio metro","a la cintura"]:f<1.15?["un metro","al pecho"]:f<1.6?["metro y medio","a la cabeza"]:f<2.2?["dos metros","sobre la cabeza"]:["grande","de doble para arriba"];
const cap=t=>t[0].toUpperCase()+t.slice(1);
const cleanWord=x=>{const w=windWord(x.ws,x.wd,x.key)[0];return ["glassy","offshore","cross-offshore"].includes(w)?"limpio":w==="cross-shore"?"con textura":"desordenado"};
const lvlName=s=>["no pasa","igual sale","bueno","épico","épico"][lvl(s)];
const mr=f=>`${fm(f*.85)}–${fm(f*1.15)} m`;
const periodWord=t=>t<10?"olas seguidas y cortas":t<13?"series normales":"series espaciadas y con fuerza";
function tideTrend(key,i){const S=DATA.spots[key],a=S.tide[i],b=S.tide[i+1];return a==null||b==null?"":b>a?"marea subiendo":"marea bajando"}
function segments(key,d){ // agrupa las horas con luz en tramos de estado parecido
  const [sr,ss]=daylight(key,d),out=[];
  for(let h=Math.ceil(sr-.25);h<=Math.floor(ss-.5);h++){const x=hourly(key,d*24+h),L=Math.min(lvl(x.score),2),c=cleanWord(x),id=L+"|"+(L===0?"":c);
    const last=out[out.length-1];if(last&&last.id===id){last.end=h+1;last.xs.push(x)}else out.push({id,L,c,start:h,end:h+1,xs:[x]})}
  return out.map(sg=>{const ws=Math.round(sg.xs.reduce((m,x)=>m+x.ws,0)/sg.xs.length),f=sg.xs.reduce((m,x)=>m+x.face,0)/sg.xs.length,w=windWord(ws,sg.xs[0].wd,key)[0];
    const tp=Math.round(sg.xs.reduce((m,x)=>m+x.teff,0)/sg.xs.length);
    const wd0=sg.xs[Math.floor(sg.xs.length/2)].wd,wc=windWord(ws,wd0,key)[1];
    const sd0=sg.xs[Math.floor(sg.xs.length/2)].sd;
    const txt=`<span class="nw">${sarrow(sd0)}${mr(f)}</span> · ${tp} s · <span class="nw">${arrow(wd0,wc)}${ws} km/h</span> <span class="wtag ${wc}">${w}</span>`;
    return {...sg,txt}});
}
function secondWindow(key,d,a){ // otra ventana surfeable separada al menos 3 h de la principal
  let b=null;for(const x of a.hrs){const h=x.i%24;if(Math.abs(h-a.best.start)<3&&Math.abs(h-(a.best.end-1))<3) continue;if(lvl(x.score)>=1&&cleanWord(x)!=="desordenado"&&(!b||x.score>b.score))b=x}
  return b}
function spoilAt(key,d,fromH){const [,ss]=daylight(key,d);for(let h=Math.ceil(fromH);h<=Math.floor(ss);h++){const x=hourly(key,d*24+h);if((windWord(x.ws,x.wd,key)[1]==="w-bad"&&x.ws>=12)||x.ws>=22) return h}return null}

const arrow=(wd,cls="")=>wd==null?"":`<svg class="arr ${cls}" width="12" height="12" viewBox="0 0 16 16" aria-label="viento del ${es16(wd)}" style="transform:rotate(${(wd+180)%360}deg)"><path d="M8 1.5 L13 13 L8 10.2 L3 13 Z" fill="currentColor"/></svg>`;
const sarrow=sd=>sd==null?"":`<svg class="arr sw" width="12" height="12" viewBox="0 0 16 16" aria-label="swell del ${es16(sd)}" style="transform:rotate(${(sd+180)%360}deg)"><path d="M8 1 L12.5 7 L9.6 7 L9.6 15 L6.4 15 L6.4 7 L3.5 7 Z" fill="currentColor"/></svg>`;
/* potencia de la ola: escala de 0 a 60 kW/m en cinco tramos con nombre */
const PW=[{to:5,w:"floja",c:"var(--base)",n:"casi no empuja"},{to:12,w:"suave",c:"var(--c2)",n:"fácil, ideal para tablas grandes"},
  {to:30,w:"buena",c:"var(--ok)",n:"empuja bien, la mejor para surfear"},{to:50,w:"potente",c:"var(--amber)",n:"pesada, para nivel avanzado"},
  {to:80,w:"muy pesada",c:"var(--maral)",n:"peligrosa salvo en Topocalma con experiencia"}];
const pwBand=kw=>PW.find(b=>kw<b.to)||PW[PW.length-1];
function pwMeter(kw,w=100){const max=60,X=v=>Math.min(v,max)/max*w;let g="",x=0;
  PW.forEach(b=>{const x2=X(Math.min(b.to,max));if(x2>x){g+=`<rect x="${x+.5}" y="5" width="${Math.max(0,x2-x-1)}" height="5" rx="1" fill="${b.c}" opacity="${b===pwBand(kw)?1:.35}"/>`;x=x2}});
  const mx=X(kw);g+=`<path d="M${mx-3.5} 0 L${mx+3.5} 0 L${mx} 4.5 Z" fill="var(--ink)"/>`;
  return `<svg class="pwm" viewBox="0 0 ${w} 11" width="${w}" height="11" aria-hidden="true">${g}</svg>`}
const perShort=t=>t<9?"corto":t<12?"normal":t<15?"espaciado":"largo";
const camBtn=k=>{const c=SPOTS[k].cam;return c?`<a class="cam" href="${c.url}" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="4" width="10" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 7 L15 5 L15 11 L11 9 Z" fill="currentColor"/></svg>Ver cámara<small>${c.by} · ${c.note}</small></a>`:""};

  return `<div><b>${mr(x.face)}</b><span>ola en la rompiente</span></div>
    <div><b>${sarrow(x.sd)}${fm(x.sh)} m</b><span>altura del swell · del ${es16(x.sd)}</span></div>
    <div><b>${Math.round(x.teff)} s</b><span>período · ${perShort(x.teff)}</span></div>
    <div><b>${Math.round(x.kw)} kW/m</b>${pwMeter(x.kw)}<span>potencia ${pwBand(x.kw).w}</span></div>
    <div><b>${arrow(x.wd,ww[1])}${Math.round(x.ws)} km/h</b><span>del ${es16(x.wd)} · <span class="wtag ${ww[1]}">${ww[0]}</span></span></div>
    ${extra?`<div><b>${extra[0]}</b><span>${extra[1]}</span></div>`:""}`}

/* ——— 1 · decidir ——— */
let verdictDay=curDay, verdictKey=null;
function renderVerdict(){
  const hNow=nowIdx-curDay*24;let d=curDay,when="Hoy";
  let b=nowIdx>=0&&nowIdx<NH?bestOf(curDay,hNow+.5):null;
  if(!b||b.hrs.length<2){d=Math.min(curDay+1,ND-1);when=d===curDay+1?"Mañana":dLong(d);b=bestOf(d)}
  verdictDay=d;verdictKey=b.key;
  const x=b.best.a,L=lvl(b.score),P=SPOTS[b.key],sz=sizeWord(x.face),sp=spoilAt(b.key,d,b.best.end),cf=confidence(x);
  const st=[["No pasa","st-no"],["Igual sale","st-maybe"],["Bueno","st-maybe"],["Épico","st-go"],["Épico","st-go"]][L];
  const line=L>=1?`${when}: ${P.name}, ${hhmm(b.best.start)}–${hhmm(b.best.end)}.`:`${when}: no pasa.`;
  let wk=null;for(let dd=curDay;dd<Math.min(ND,curDay+7);dd++){const z=bestOf(dd);if(!wk||z.score>wk.score)wk=z}
  const better=wk&&wk.d!==d&&lvl(wk.score)>L?` El mejor día de la semana es el <b>${dLong(wk.d)} ${dNum(wk.d)}</b> en ${SPOTS[wk.key].name}.`:"";
  document.getElementById("verdict").innerHTML=`
    <span class="status ${st[1]}">${st[0]}</span>
    <h2 class="line">${line}</h2>
    ${L>=1?camBtn(b.key):""}
    <div class="facts">${metrics(x,b.key,[sp!=null?hhmm(sp):"no",sp!=null?"se ensucia":"se ensucia en el día"])}</div>
    <p class="aside" style="margin-top:-4px">Peak de la ola a las <b>${hhmm(b.peak.i%24)}</b>.</p>
    <p class="expect"><b>Qué esperar:</b> olas ${sz[1]}, mar ${cleanWord(x)}, ${periodWord(x.teff)} (${Math.round(x.teff)} s), ${tideTrend(b.key,x.i)}. ${(()=>{const bd=board(x,b.key);return `Lleva ${bd[0]}: ${bd[1]}.`})()}${(()=>{const s2=secondWindow(b.key,d,b);return s2?` Si no alcanzas, hay una segunda opción a las <b>${hhmm(s2.i%24)}</b> (${lvlName(s2.score)}).`:""})()}</p>
    <p class="aside">Confianza <b>${cf[0]}</b>.${better}</p>`;
}

/* ——— 2 · semana ——— */
let selDay=curDay, selKey=null;
function renderMatrix(){
  const days=[];for(let d=curDay;d<ND;d++)days.push(d);
  const nT=days.filter(TREND).length;
  let h=`<table><thead>${nT?`<tr><th></th><th colspan="${days.length-nT}"></th><th colspan="${nT}" class="trend-h">tendencia</th></tr>`:""}<tr><th class="s"></th>${days.map(d=>`<th class="d${TREND(d)?" tr":""}">${dName(d)}<b>${dNum(d)}</b></th>`).join("")}</tr></thead><tbody>`;
  KEYS.forEach(k=>{h+=`<tr><th class="s" scope="row">${SPOTS[k].name}</th>`+days.map(d=>{const a=ANA[d][k],b=bestOf(d),best=b.key===k&&lvl(a.score)>=1,sel=d===selDay&&k===(selKey||b.key);
    return `<td><button class="cell l${lvl(a.score)}${best&&!TREND(d)?" best":""}${sel?" sel":""}${TREND(d)?" tr":""}" data-d="${d}" data-k="${k}" aria-label="${SPOTS[k].name}, ${dLong(d)}: ${lvlName(a.score)}${TREND(d)?" (tendencia)":`, ${a.score.toFixed(1)}, a las ${hhmm(a.best.start)}`}"><b>${a.score.toFixed(1)}</b>${TREND(d)?"":`<small>${hhmm(a.best.start).slice(0,2)}h</small>`}<small>${fm(a.best.a.face)} m</small></button></td>`}).join("")+`</tr>`});
  document.getElementById("mx").innerHTML=h+`</tbody></table>`;
  document.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{selDay=+c.dataset.d;selKey=c.dataset.k;renderMatrix();renderDay()});
}

/* ——— 3 · detalle ——— */
function chart(key,d){
  const S=DATA.spots[key],P=SPOTS[key],a=ANA[d][key],[sr,ss]=daylight(key,d);
  const W=540,x0=34,x1=W-8,h0=5,h1=21,X=h=>x0+(h-h0)/(h1-h0)*(x1-x0);
  const L1=[38,98],L2=[112,158],L3=[174,204],H=222,idx=h=>d*24+h,rng=[];for(let h=h0;h<=h1;h++)rng.push(h);
  const top=Math.max(1.5,...rng.map(h=>S.sh[idx(h)]||0)),step=top>3?1:.5,maxS=Math.ceil(top*1.15/step)*step,Y1=v=>L1[1]-v/maxS*(L1[1]-L1[0]);
  const lab=(x,y,t,anchor="start",c="var(--muted)")=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="10" fill="${c}" font-family="IBM Plex Mono">${t}</text>`;
  let g=`<rect x="${X(h0)}" y="0" width="${Math.max(0,X(sr)-X(h0))}" height="${L3[1]}" fill="var(--panel)"/><rect x="${X(ss)}" y="0" width="${Math.max(0,X(h1)-X(ss))}" height="${L3[1]}" fill="var(--panel)"/>`;
  if(a) g+=`<rect x="${X(a.best.start)}" y="0" width="${X(a.best.end)-X(a.best.start)}" height="${L3[1]+3}" fill="var(--amber)" opacity=".3"/>`;
  // franja de calidad hora a hora
  const cw=(x1-x0)/(h1-h0);rng.forEach(h=>{if(h===h1) return;const L=lvl(hourly(key,idx(h)).score),night=h<Math.floor(sr)||h>=Math.ceil(ss);
    g+=`<rect x="${X(h)+.5}" y="0" width="${cw-1}" height="7" rx="1.5" fill="var(--c${L})" opacity="${night?.25:1}"/>`});
  // ola: eje de altura con líneas guía leves
  for(let v=step;v<=maxS+1e-6;v+=step){const y=Y1(v);
    g+=`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`+lab(x0-5,y+3.5,fm(v).replace(",0","")+(v+step>maxS+1e-6?" m":""),"end")}
  g+=`<line x1="${x0}" x2="${x1}" y1="${L1[1]}" y2="${L1[1]}" stroke="var(--base)" stroke-width="1"/>`+lab(x0-5,L1[1]+3.5,"0","end");
  const minSw=P.min/P.k;
  if(minSw<maxS) g+=`<line x1="${x0}" x2="${x1}" y1="${Y1(minSw)}" y2="${Y1(minSw)}" stroke="var(--base)" stroke-dasharray="2 3"/>`+lab(x1,Y1(minSw)-3,"rompe desde aquí","end");
  g+=`<polyline points="${rng.map(h=>`${X(h)},${Y1(S.sh[idx(h)]||0)}`).join(" ")}" fill="none" stroke="var(--blue)" stroke-width="2.4" stroke-linejoin="round"/>`;
  if(a){const pk=a.peak.i%24;g+=`<circle cx="${X(pk)}" cy="${Y1(S.sh[idx(pk)])}" r="4" fill="var(--bg)" stroke="var(--blue)" stroke-width="2"/>`}
  // dirección del swell: fila propia sobre el carril de la ola, separada del viento
  for(let h=h0+1;h<h1;h+=2){const sd=S.sd[idx(h)];if(sd==null) continue;
    g+=`<g transform="translate(${X(h)},${L1[0]-14}) rotate(${(sd+180)%360})"><path d="M0 -5.5 L3.8 -0.5 L1.4 -0.5 L1.4 5.5 L-1.4 5.5 L-1.4 -0.5 L-3.8 -0.5 Z" fill="var(--blue)" opacity=".8"/></g>`}
  // viento: flechas arriba y barras por color; número solo dentro de la ventana
  g+=lab(x0,L2[0]-4,"viento");
  const maxW=Math.max(30,...rng.map(h=>S.ws[idx(h)]||0)),bw=(x1-x0)/(h1-h0)*.6;
  rng.forEach(h=>{if(h===h1) return;const ws=S.ws[idx(h)]||0,wd=S.wd[idx(h)]||0,c=windWord(ws,wd,key)[1],col=c==="w-good"?"var(--ok)":c==="w-bad"?"var(--maral)":"var(--muted)";
    g+=`<g transform="translate(${X(h)},${L2[0]+6}) rotate(${(wd+180)%360})"><path d="M0 -5.5 L4 5 L0 2.6 L-4 5 Z" fill="${col}"/></g>`});
  rng.forEach(h=>{const ws=S.ws[idx(h)]||0,c=windWord(ws,S.wd[idx(h)]||0,key)[1],col=c==="w-good"?"var(--ok)":c==="w-bad"?"var(--maral)":"var(--base)",hh=Math.max(1.5,ws/maxW*(L2[1]-L2[0]-22));
    g+=`<rect x="${X(h)-bw/2}" y="${L2[1]-hh}" width="${bw}" height="${hh}" fill="${col}"/>`;
    if(a&&h>=a.best.start&&h<a.best.end) g+=lab(X(h),L2[1]-hh-3,Math.round(ws),"middle","var(--ink)")});
  // marea
  const tv=rng.map(h=>S.tide[idx(h)]).filter(v=>v!=null),tmin=Math.min(...tv,-.5),tmax=Math.max(...tv,.7),Y3=v=>L3[1]-(v-tmin)/(tmax-tmin)*(L3[1]-L3[0]);
  g+=lab(x0,L3[0]-4,"marea");
  g+=`<polyline points="${rng.map(h=>`${X(h)},${Y3(S.tide[idx(h)]??0)}`).join(" ")}" fill="none" stroke="var(--base)" stroke-width="1.4"/>`;
  tidesOn(key,d).filter(t=>t.h>=h0+.5&&t.h<=h1-.5).forEach(t=>g+=lab(X(t.h),t.type==="alta"?Y3(t.ht)-4:Y3(t.ht)+12,`${t.type==="alta"?"alta":"baja"} ${hhmm(t.h)}`,"middle","var(--ink)"));
  for(let h=6;h<=21;h+=3) g+=lab(X(h),H-3,h+"h","middle","var(--ink)");
  // ahora: punto que late sobre la ola, solo si el gráfico es de hoy (se mueve con el reloj)
  g+=`<g class="nowg" pointer-events="none">${nowMark(key,d,X,Y1,L1,L3)}</g>`;
  // guía y zona sensible para el globo de datos
  g+=`<line class="guide" x1="0" x2="0" y1="0" y2="${L3[1]}" stroke="var(--ink)" stroke-width="1" opacity="0"/><circle class="gdot" r="4" cx="0" cy="0" fill="var(--blue)" stroke="var(--bg)" stroke-width="2" opacity="0"/>`;
  g+=`<rect class="hit" x="${x0}" y="0" width="${x1-x0}" height="${H}" fill="transparent"/>`;
  return `<div class="chart" data-k="${key}" data-d="${d}" data-x0="${x0}" data-x1="${x1}" data-h0="${h0}" data-h1="${h1}" data-max="${maxS}" data-l1="${L1.join(",")}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ola, viento y marea por hora en ${P.name}">${g}</svg><div class="tip" hidden></div></div>`;
}
function nowMark(key,d,X,Y1,L1,L3){
  const h=(Date.now()-T0)/36e5-d*24;if(h<5||h>21) return "";
  const S=DATA.spots[key].sh,i=d*24+Math.floor(h),f=h%1,v=(S[i]||0)+((S[i+1]??S[i])-(S[i]||0))*f,x=X(h),y=Y1(v);
  const near=x<X(5)+30,lx=near?x+6:x;
  return `<line x1="${x}" x2="${x}" y1="9" y2="${L3[1]}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="1 3" opacity=".45"/>`+
    `<circle class="nowp" cx="${x}" cy="${y}" r="5" fill="var(--ink)"/><circle cx="${x}" cy="${y}" r="4" fill="var(--ink)" stroke="var(--bg)" stroke-width="1.5"/>`+
    `<text x="${lx}" y="${L1[1]+11}" text-anchor="${near?"start":"middle"}" font-size="10" font-weight="600" fill="var(--ink)" stroke="var(--bg)" stroke-width="3" paint-order="stroke" font-family="IBM Plex Mono">ahora ${fmtCL.format(new Date())}</text>`}
function refreshNow(){document.querySelectorAll(".chart").forEach(c=>{const k=c.dataset.k,d=+c.dataset.d,g=c.querySelector(".nowg");if(!g) return;
  const x0=+c.dataset.x0,x1=+c.dataset.x1,h0=+c.dataset.h0,h1=+c.dataset.h1,[a,b]=c.dataset.l1.split(",").map(Number),mx=+c.dataset.max;
  g.innerHTML=nowMark(k,d,h=>x0+(h-h0)/(h1-h0)*(x1-x0),v=>b-v/mx*(b-a),[a,b],[174,204])})}
/* globo de datos al pasar el dedo o el mouse sobre el gráfico */
function tipHTML(k,i){const x=hourly(k,i),ww=windWord(x.ws,x.wd,k),S=DATA.spots[k],tr=tideTrend(k,i);
  return `<div class="tip-h"><b>${hhmm(i%24)}</b><span class="lvl l${lvl(x.score)}">${lvlName(x.score)}</span></div>
  <dl><dt>Swell</dt><dd>${sarrow(x.sd)}${fm(x.sh)} m · del ${es16(x.sd)}</dd>
  <dt>Rompiente</dt><dd>${mr(x.face)}</dd>
  <dt>Período</dt><dd>${Math.round(x.teff)} s · ${perShort(x.teff)}</dd>
  <dt>Potencia</dt><dd>${Math.round(x.kw)} kW/m · ${pwBand(x.kw).w}</dd>
  <dt>Viento</dt><dd>${arrow(x.wd,ww[1])}${Math.round(x.ws)} km/h ${es16(x.wd)}<br><span class="wtag ${ww[1]}">${ww[0]}</span> · rachas ${Math.round(x.wg??x.ws)}</dd>
  <dt>Marea</dt><dd>${S.tide[i]!=null?(S.tide[i]>0?"+":"")+S.tide[i].toFixed(2).replace(".",",")+" m":"–"}${tr?" · "+tr.replace("marea ",""):""}</dd>
</dl>`}
function chartMove(e){const c=e.currentTarget,svg=c.querySelector("svg"),tip=c.querySelector(".tip");
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const x0=+c.dataset.x0,x1=+c.dataset.x1,h0=+c.dataset.h0,h1=+c.dataset.h1;
  const h=Math.round(clamp(h0+(p.x-x0)/(x1-x0)*(h1-h0),h0,h1)),k=c.dataset.k,d=+c.dataset.d,i=d*24+h,X=x0+(h-h0)/(h1-h0)*(x1-x0);
  const [a,b]=c.dataset.l1.split(",").map(Number),y=b-(DATA.spots[k].sh[i]||0)/(+c.dataset.max)*(b-a);
  const gl=svg.querySelector(".guide"),gd=svg.querySelector(".gdot");gl.setAttribute("x1",X);gl.setAttribute("x2",X);gl.setAttribute("opacity",".35");gd.setAttribute("cx",X);gd.setAttribute("cy",y);gd.setAttribute("opacity","1");
  if(tip.dataset.i!=i){tip.innerHTML=tipHTML(k,i);tip.dataset.i=i}
  tip.hidden=false;const r=c.getBoundingClientRect(),px=(X/svg.viewBox.baseVal.width)*r.width,tw=tip.offsetWidth;
  tip.style.left=Math.round(px+14+tw>r.width?px-14-tw:px+14)+"px";}
function chartLeave(e){const c=e.currentTarget;c.querySelector(".tip").hidden=true;c.querySelectorAll(".guide,.gdot").forEach(el=>el.setAttribute("opacity","0"))}
function grab(move){return e=>{if(e.pointerType==="mouse"){e.preventDefault();try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}}move(e)}}
function release(leave){return e=>{const t=e.currentTarget;try{if(t.hasPointerCapture(e.pointerId)){t.releasePointerCapture(e.pointerId);
  const r=t.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)leave(e)}}catch(_){}}}
function bindCharts(){document.querySelectorAll(".chart[data-k]").forEach(c=>{if(c.dataset.bound) return;c.dataset.bound=1;
  c.addEventListener("pointermove",chartMove);c.addEventListener("pointerdown",grab(chartMove));c.addEventListener("pointerup",release(chartLeave));
  c.addEventListener("pointerleave",e=>{if(!c.hasPointerCapture||!c.hasPointerCapture(e.pointerId))chartLeave(e)});
  c.addEventListener("dragstart",e=>e.preventDefault());c.addEventListener("selectstart",e=>e.preventDefault())})}
const legend=`<div class="scale" style="margin-top:0"><span><i style="background:var(--amber);opacity:.5"></i>ventana</span><span><i style="background:var(--ok)"></i>offshore</span><span><i style="background:var(--base)"></i>cross-shore</span><span><i style="background:var(--maral)"></i>onshore</span><span>flechas: hacia dónde van el swell (azul, arriba) y el viento</span></div>`;
function trio(k,a){const x=a.best.a;
  return `<div class="facts">${metrics(x,k,[`${hhmm(a.best.start)}–${hhmm(a.best.end)}`,"ventana"])}</div><p class="aside">${(()=>{const bd=board(x,k);return `Lleva <b>${bd[0].replace(/^(el|una|un) /,"")}</b>: ${bd[1]}.`})()}</p>`}
function more(k){const P=SPOTS[k];return `<details class="more"><summary>Claves de ${P.name}</summary><p>${P.style} ${P.tideNote}</p><div class="links">${P.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join("")}</div></details>`}
function compare(k,main){const a=ANA[selDay][k],x=a.best.a,m=main.best.a,df=x.face-m.face;
  const size=df<-.25?"más chico":df>.25?"más grande":"mismo tamaño";
  return `<span class="nw">${sarrow(x.sd)}${mr(x.face)}</span> · ${Math.round(x.teff)} s · <span class="nw">${arrow(x.wd,windWord(x.ws,x.wd,k)[1])}${Math.round(x.ws)} km/h</span> · ${hhmm(a.best.start)}`}
function renderDay(){
  const d=selDay,mainK=selKey||bestOf(d).key,a=ANA[d][mainK],P=SPOTS[mainK],x=a.best.a,sp=spoilAt(mainK,d,a.best.end);
  const sum=lvl(a.score)>=1?`${mr(x.face)}, mar ${cleanWord(x)}, entre ${hhmm(a.best.start)} y ${hhmm(a.best.end)}.${sp!=null?` El viento lo ensucia desde las ${hhmm(sp)}.`:" Aguanta limpio el resto del día."}`:`No pasa. Lo más decente es a las ${hhmm(a.best.start)} (${mr(x.face)}).`;
  const others=KEYS.filter(k=>k!==mainK).sort((p,q)=>ANA[d][q].score-ANA[d][p].score);
  const trendNote=TREND(d)?`<p class="warn" style="margin:0">Tendencia: a esta distancia quedan 1–2 modelos de ola y 3–4 de viento. Sirve para ver si viene swell y de qué tamaño, no para elegir la hora.</p>`:"";
  document.getElementById("day").innerHTML=trendNote+`
    <div class="k">${dLong(d)} ${dNum(d)}</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h3>${P.name}</h3><span class="lvl l${lvl(a.score)}">${lvlName(a.score)}</span></div>
    ${d===curDay?camBtn(mainK):""}
    <p class="sum">${sum}</p>
    ${chart(mainK,d)}${legend}
    <ol class="tramos">${segments(mainK,d).map(sg=>`<li class="${sg.start<=a.best.start&&sg.end>a.best.start?"now":""}"><span class="h">${hhmm(sg.start)}–${hhmm(sg.end)}</span><span class="lvl l${sg.L}">${lvlName(sg.xs.reduce((m,x)=>Math.max(m,x.score),0))}</span><span>${sg.txt}</span></li>`).join("")}</ol>
    ${trio(mainK,a)}
    ${more(mainK)}
    <div class="others">${others.map(k=>{const o=ANA[d][k];return `<details><summary><strong>${SPOTS[k].name}</strong><span class="t">${compare(k,a)}</span><span class="lvl l${lvl(o.score)}">${lvlName(o.score)}</span></summary>
      <div class="inner">${chart(k,d)}${trio(k,o)}${more(k)}</div></details>`}).join("")}</div>`;
  renderWhy();bindCharts();
  document.querySelectorAll('.others details').forEach(dt=>dt.addEventListener('toggle',bindCharts));
}

/* ——— 4 · verificar ——— */
function spread(k,d){const a=ANA[d][k];if(!a) return "";const S=DATA.spots[k],i=a.peak.i,M=S.models||{};
  const kind=s_=>(M.wave||[]).includes(s_)||(M.wind||[]).includes(s_)?"modelo":"sitio web";
  const row=(src,cut,med,unit,f,lo,hi,label,var_)=>{const ent=Object.entries(src).filter(([,v])=>v[i]!=null);if(ent.length<2) return "";
    const vals=ent.map(([,v])=>v[i]),mn=Math.min(lo,...vals),mx=Math.max(hi,...vals),pad=(mx-mn)*.1||.1,A=mn-pad,B=mx+pad,W=520,x0=110,x1=W-14,X=v=>x0+(v-A)/(B-A)*(x1-x0);
    let g=`<text x="0" y="16" font-size="11" fill="var(--ink)" font-family="IBM Plex Sans" font-weight="600">${label}</text>`;
    g+=`<line x1="${x0}" x2="${x1}" y1="12" y2="12" stroke="var(--grid)"/><rect x="${X(lo)}" y="6" width="${Math.max(1,X(hi)-X(lo))}" height="12" fill="var(--blue2)" opacity=".5" rx="2"/>`;
    g+=`<line x1="${X(med)}" x2="${X(med)}" y1="2" y2="22" stroke="var(--blue)" stroke-width="2"/>`;
    const pts=ent.map(([s_,v])=>({s:s_,v:v[i],c:(cut[s_]||[]).includes(i),x:+X(v[i]).toFixed(1),k:kind(s_)}));
    pts.forEach(p=>{g+=`<circle cx="${p.x}" cy="12" r="4.5" fill="${p.c?"var(--bg)":"var(--ink)"}" stroke="${p.c?"var(--maral)":"var(--bg)"}" stroke-width="${p.c?2:1}"/>`});
    g+=`<circle class="ring" cx="0" cy="12" r="7.5" fill="none" stroke="var(--blue)" stroke-width="1.5" opacity="0"/>`;
    g+=`<text x="${x0}" y="36" font-size="9.5" fill="var(--muted)" font-family="IBM Plex Mono">${f(A)}</text><text x="${x1}" y="36" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="IBM Plex Mono">${f(B)} ${unit}</text>`;
    const cuts=pts.filter(p=>p.c).map(p=>`${p.s} ${f(p.v)}`);
    const meta=JSON.stringify({pts,med,lo,hi,unit,mx:+X(med).toFixed(1),dec:var_==="sh"?1:0}).replace(/"/g,"&quot;");
    return `<div class="srow" data-meta="${meta}"><svg viewBox="0 0 ${W} 40" style="width:100%;display:block;cursor:crosshair">${g}</svg><div class="tip" hidden></div></div>${cuts.length?`<div class="src" style="margin:-2px 0 6px 0">Descartada${cuts.length>1?"s":""}: ${cuts.join(", ")}</div>`:""}`};
  return `<div><div class="k" style="margin-bottom:4px">Qué dice cada fuente a las ${hhmm(i%24)} · toca un punto para ver el detalle</div>
    ${row(S.srcSh||{},S.cutSh||{},S.sh[i],"m",v=>fm(v),S.shLo?.[i]??S.sh[i],S.shHi?.[i]??S.sh[i],"Swell","sh")}
    ${row(S.srcWs||{},S.cutWs||{},S.ws[i],"km/h",v=>Math.round(v),S.wsLo?.[i]??S.ws[i],S.wsHi?.[i]??S.ws[i],"Viento","ws")}
    <div class="scale" style="margin-top:2px"><span><i style="background:var(--ink);border-radius:50%"></i>fuente usada</span><span><i style="background:transparent;border:2px solid var(--maral);border-radius:50%"></i>descartada</span><span><i style="background:var(--blue);width:3px"></i>mediana</span><span><i style="background:var(--blue2);opacity:.6"></i>rango usado</span></div></div>`}
function srowMove(e){const r=e.currentTarget,svg=r.querySelector("svg"),tip=r.querySelector(".tip"),m=JSON.parse(r.dataset.meta);
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const fmt=v=>m.dec?fm(v):Math.round(v);let best=null;m.pts.forEach(q=>{const dx=Math.abs(q.x-p.x);if(!best||dx<best.dx)best={...q,dx}});
  const ring=svg.querySelector(".ring");let html,x;
  if(Math.abs(m.mx-p.x)<Math.min(8,best.dx)){x=m.mx;ring.setAttribute("opacity","0");
    const used=m.pts.filter(q=>!q.c).length;
    html=`<div class="tip-h"><b>Mediana</b></div><dl><dt>Valor</dt><dd>${fmt(m.med)} ${m.unit}</dd><dt>Rango usado</dt><dd>${fmt(m.lo)}–${fmt(m.hi)} ${m.unit}</dd><dt>Fuentes</dt><dd>${used} usadas · ${m.pts.length-used} descartadas</dd></dl><p class="tip-n">El valor del medio de las fuentes que quedaron. Una fuente extrema no la mueve.</p>`;}
  else{x=best.x;ring.setAttribute("cx",best.x);ring.setAttribute("opacity","1");
    const diff=best.v-m.med,pct=m.med?Math.round(100*diff/m.med):0,sgn=diff>0?"+":"";
    html=`<div class="tip-h"><b>${best.s}</b><span class="mono" style="color:var(--muted)">${best.k}</span></div><dl><dt>Dice</dt><dd>${fmt(best.v)} ${m.unit}</dd><dt>Vs mediana</dt><dd>${sgn}${fmt(diff)} ${m.unit} (${sgn}${pct}%)</dd></dl>
    <p class="tip-n">${best.c?`<b style="color:var(--maral)">Descartada:</b> se aleja demasiado del resto, así que no entra en la recomendación.`:`<b>Usada</b> en la mediana: está dentro de lo que dicen las demás fuentes.`}</p>`;}
  if(tip.dataset.h!==html){tip.innerHTML=html;tip.dataset.h=html}
  tip.hidden=false;const rr=r.getBoundingClientRect(),px=x/svg.viewBox.baseVal.width*rr.width,tw=tip.offsetWidth;
  tip.style.left=Math.round(Math.max(0,px+12+tw>rr.width?px-12-tw:px+12))+"px";}
function srowLeave(e){const r=e.currentTarget;r.querySelector(".tip").hidden=true;r.querySelector(".ring").setAttribute("opacity","0")}
function bindSrows(){document.querySelectorAll(".srow").forEach(r=>{if(r.dataset.bound) return;r.dataset.bound=1;
  r.addEventListener("pointermove",srowMove);r.addEventListener("pointerdown",grab(srowMove));r.addEventListener("pointerup",release(srowLeave));
  r.addEventListener("pointerleave",e=>{if(!r.hasPointerCapture||!r.hasPointerCapture(e.pointerId))srowLeave(e)});
  r.addEventListener("dragstart",e=>e.preventDefault());r.addEventListener("selectstart",e=>e.preventDefault())})}
function srcLine(k,d){const A=(DATA.spots[k].audit||{})[dKey(d)]||[];if(!A.length) return "";
  const used=A.filter(x=>x.used>0).length,cut=A.filter(x=>x.cut>0&&x.cut/(x.used+x.cut)>=.25);
  return `<div class="src"><b>${used} fuentes</b> en la mediana${cut.length?` · descartadas parte del día: ${cut.map(x=>`${x.src} (${Math.round(100*x.cut/(x.used+x.cut))}%)`).join(", ")}`:" · ninguna descartada"}</div>`}

function renderWhy(){setTimeout(bindSrows,0);
  const d=selDay,k=selKey||bestOf(d).key,a=ANA[d][k],x=a.best.a,cf=confidence(x),M=DATA.spots[k].models||{};
  const web=[...new Set(KEYS.flatMap(kk=>(DATA.spots[kk].models||{}).web||[]))];
  document.getElementById("whyBody").innerHTML=`
    <p><b>Confianza ${cf[0]}:</b> ${cf[1]}. Para ${SPOTS[k].name} a las ${hhmm(a.peak.i%24)}, el swell va de ${fm(x.lo)} a ${fm(x.hi)} m según la fuente (mediana ${fm(x.sh)} m, ${Math.round(x.sp)} s) y el viento de ${Math.round(x.wsLo)} a ${Math.round(x.wsHi)} km/h.</p>
    ${spread(k,d)}
    ${srcLine(k,d)}
    <p><b>Potencia.</b> La fuerza con que llega la ola, en kilovatios por metro de frente: 0,49 × altura² × período. Floja bajo 5, suave de 5 a 12, buena de 12 a 30, potente de 30 a 50 y muy pesada sobre 50. Hoy en ${SPOTS[k].name}: ${Math.round(x.kw)} kW/m, ${pwBand(x.kw).w} (${pwBand(x.kw).n}).</p>
    ${(()=>{let h='<div class="pwlegend">';PW.forEach((b,j)=>{h+=`<span><i style="background:${b.c}"></i>${b.w} <small>${j?PW[j-1].to:0}–${j<PW.length-1?b.to:"+"}</small></span>`});return h+'</div>'})()}
    <p><b>Método.</b> Cada hora junta todos los modelos y sitios, descarta los valores que se alejan demasiado del resto (más de 2,5 MAD, con tope de 40% en altura, 30% en período y 50% en viento) y recomienda con la <b>mediana</b> de lo que queda.</p>
    <p><b>Puntaje.</b> Tamaño estimado en la rompiente (swell × factor del spot × período) contra el rango ideal de cada punta, período, dirección del swell, viento según la orientación de cada punta, mar de viento y marea. "Se ensucia" es la primera hora después de la ventana con viento onshore de 12 km/h o más, o cualquier viento sobre 22 km/h.</p>
    <p><b>Fuentes.</b> Oleaje: ${(M.wave||[]).join(", ")}. Viento: ${(M.wind||[]).join(", ")}. Sitios: ${web.join(", ")||"ninguno legible en esta corrida"}.${(M.failed||[]).length?` Sin respuesta: ${M.failed.join(", ")}.`:""}</p>`;
}

renderVerdict();selDay=verdictDay;selKey=null;renderMatrix();renderDay();
const sst=DATA.spots.mat.sst.find(v=>v!=null);
document.getElementById("foot").innerHTML=`Agua ${sst?Math.round(sst)+"°":"–"}: traje 4/3${sst&&sst<15?" con botines":""}. El tamaño en la rompiente, el nivel y la tabla son estimaciones propias. Se actualiza a las 00:00, 06:00, 12:00 y 18:00.`;
</script>
